<!DOCTYPE html>
<html>

<head>

<title>NovaSOC Investigation</title>

<style>

body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    z-index:1;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
}

.modal-content{
    background:#1e293b;
    margin:5% auto;
    padding:20px;
    width:700px;
    border-radius:8px;
}

.panel{
    background:#0f172a;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
}

.alert{
    background:#dc2626;
    padding:10px;
    font-size:18px;
}

.close{
    float:right;
    font-size:22px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>NovaSOC Autonomous Investigation</h1>

<input type="file" id="fileInput">
<br><br>

<button onclick="runInvestigation()">Run Investigation</button>

<div id="dashboardModal" class="modal">

<div class="modal-content">

<span class="close" onclick="closeModal()">✖</span>

<h2>Investigation Dashboard</h2>

<div id="summary" class="alert"></div>

<div class="panel">
<h3>Detected IPs</h3>
<div id="ips"></div>
</div>

<div class="panel">
<h3>Threat Intelligence</h3>
<pre id="intel"></pre>
</div>

<div class="panel">
<h3>AI Investigation Result</h3>
<div id="ai"></div>
</div>

<div class="panel">
<h3>Investigation Steps</h3>
<ul id="steps"></ul>
</div>

</div>

</div>

<script>

function closeModal(){
    document.getElementById("dashboardModal").style.display="none";
}

async function runInvestigation(){

    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if(!file){
        alert("Select a JSON file");
        return;
    }

    if(!file.name.endsWith(".json")){
        alert("Only JSON files allowed");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    const uploadResponse = await fetch("/upload",{
        method:"POST",
        body:formData
    });

    const uploadData = await uploadResponse.json();

    const filename = uploadData.filename;

    const response = await fetch(`/autonomous-investigate/${filename}`);
    const data = await response.json();

    const result = data.result;

    document.getElementById("summary").innerText = result.summary;

    const ips = result.investigation_steps[0].result.ips;
    document.getElementById("ips").innerText = ips.join(", ");

    const intel = result.investigation_steps[1].result;
    document.getElementById("intel").innerText = JSON.stringify(intel,null,2);

    document.getElementById("ai").innerText = result.final_assessment;

    const steps = document.getElementById("steps");
    steps.innerHTML="";

    result.investigation_steps.forEach(step =>{

        const li=document.createElement("li");
        li.innerText="✔ "+step.agent+" — "+step.action;

        steps.appendChild(li);

    });

    document.getElementById("dashboardModal").style.display="block";

}

</script>

</body>
</html>
